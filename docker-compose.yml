version: "3.9"

services:
  # ─── MySQL Database ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: tilevista_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tilevista}
      MYSQL_USER: ${MYSQL_USER:-tilevista_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tilevista_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/server/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ─── NestJS Backend ───────────────────────────────────────────
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: tilevista_server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./apps/server/.env
    ports:
      - "3001:3001"
    volumes:
      - ./apps/server/uploads:/app/uploads

  # ─── Next.js Frontend ─────────────────────────────────────────
  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    container_name: tilevista_client
    restart: unless-stopped
    depends_on:
      - server
    env_file:
      - ./apps/client/.env.local
    ports:
      - "3000:3000"

  # ─── Python FastAPI AI Service ────────────────────────────────
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: tilevista_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/ai-service/uploads:/app/uploads
      - ./apps/ai-service/sam_checkpoints:/app/sam_checkpoints
    environment:
      - MODEL_TYPE=${SAM_MODEL_TYPE:-vit_h}

volumes:
  mysql_data:
    driver: local
